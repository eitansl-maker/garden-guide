// Update when Google retires a model. All are tried in parallel; first answer wins.
const GEM_MODELS=["models/gemini-3.5-flash","models/gemini-3.6-flash","models/gemini-3.5-flash-lite","models/gemini-3.8-flash"];
async function gem(k,parts,st,only){const B="https://generativelanguage.googleapis.com/v1beta/",ctl=new AbortController(),names=only||GEM_MODELS;st(names.map(n=>n.replace("models/","")).join(" / "));
 const one=async n=>{const t0=Date.now(),nm=n.replace("models/","");
  for(const cfg of [{generationConfig:{thinkingConfig:{thinkingLevel:"low"}}},{}]){
   let r;try{r=await fetch(B+n+":generateContent?key="+k,{method:"POST",headers:{"Content-Type":"application/json"},signal:AbortSignal.any([ctl.signal,AbortSignal.timeout(25000)]),body:JSON.stringify(Object.assign({contents:[{parts}]},cfg))})}catch(e){throw new Error(nm+": "+(ctl.signal.aborted?"cancelled":"timeout after "+Math.round((Date.now()-t0)/1000)+"s"))}
   const res=await r.json().catch(()=>({error:{message:"bad response"}}));
   if(!res.error){ctl.abort();return{text:(res.candidates?.[0]?.content?.parts||[]).map(x=>x.text||"").join("")||"?",nm,ms:Date.now()-t0}}
   const m=res.error.message||"";if(/API key|PERMISSION_DENIED/i.test(m)&&!/model/i.test(m)){ctl.abort();throw new Error("KEY: "+m)}
   if(!/thinking|invalid argument|unknown name/i.test(m))throw new Error(nm+": "+m.slice(0,120))}
  throw new Error(nm+": failed")};
 try{const w=await Promise.any(names.map(one));return only?w:w.text}catch(e){const es=(e.errors||[e]).map(x=>x.message);const k_=es.find(x=>/^KEY:/.test(x));throw new Error(k_?k_.slice(5):es.join(" | "))}}
async function speedtest(k,out){out.style.display="block";out.innerHTML="";for(const n of GEM_MODELS){out.innerHTML+=`<div>⏳ ${n.replace("models/","")}...</div>`;const t0=Date.now();try{await gem(k,[{text:"ענה במילה אחת: שלום"}],()=>{},[n]);out.lastChild.textContent=`✅ ${n.replace("models/","")}: ${Math.round((Date.now()-t0)/100)/10}s`}catch(e){out.lastChild.textContent=`❌ ${e.message}`}}}
function prompt_(c){return L==="he"?"אני מגדל בישראל. בתמונה "+(c||"צמח או פרי")+". מה אתה רואה: מחלה, מזיק, מחסור או בעיית השקיה? מה לעשות? ענה בעברית קצרה וברורה: מה זה נראה, כמה אפשרויות לפי סבירות, מה לבדוק כדי לוודא, ומה לעשות. אם נדרש טיפול כימי, אל תמליץ על מינון, הפנה ליועץ שה\"ם ולתווית התכשיר.":"I grow crops in Israel. The photo shows "+(c||"a plant or fruit")+". Do you see a disease, pest, deficiency or watering problem? What should I do? Answer briefly and clearly in English: what it looks like, options by likelihood, what to check, what to do. For chemical treatment give no dosage; refer to an extension officer and the product label."}

 let f=null;ph.onchange=()=>{f=ph.files[0];if(f){pv.src=URL.createObjectURL(f);pv.style.display="block";ai.disabled=false}};
 {let k0="";try{k0=localStorage.getItem("gkey")||""}catch(e){}if(!k0){nokey.innerHTML=`<a href="#" id="gh">${t.diagNoKey} ${t.diagGoHelp}</a>`;gh.onclick=e=>{e.preventDefault();TAB="help";tabs();help()}}}

  out.style.display="block";out.innerHTML=`<span class="spin"></span>${t.diagWait}`;ai.disabled=true;

  ai.disabled=false};
 fs.onclick=async()=>{const q=fq.value.trim();if(!q||!IMG)return;let k="";try{k=localStorage.getItem("gkey")||""}catch(e){}if(!k)return;

  const d=document.createElement("div");d.className="detail";d.style.margin="8px 0";d.innerHTML=`<b></b><div class="ilan" style="white-space:pre-wrap"><span class="spin"></span>${t.diagWait}</div>`;d.firstChild.textContent=q;fl.appendChild(d);fq.value="";fs.disabled=true;
