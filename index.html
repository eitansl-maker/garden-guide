<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>הגינה של אילן</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#3f6b2d">
<style>
:root{--g:#3f6b2d;--bg:#f6f2e8;--c:#fff;--t:#2b2b25}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--g);color:#fff;padding:16px}h1{margin:0;font-size:22px}header p{margin:4px 0 0;opacity:.9;font-size:14px}
main{padding:16px;max-width:560px;margin:auto}h2{font-size:18px;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--c);border:0;border-radius:14px;padding:14px;text-align:center;font:inherit;box-shadow:0 1px 3px #0002;cursor:pointer}
.card .e{font-size:34px}.card b{display:block;margin-top:4px}
.detail{background:var(--c);border-radius:14px;padding:16px;box-shadow:0 1px 3px #0002}
.detail h3{margin:0 0 8px}.row{margin:10px 0}.row small{color:var(--g);font-weight:700;display:block}
.back{background:none;border:0;color:var(--g);font:inherit;margin-bottom:8px;cursor:pointer}
.ilan{background:#eef4e6;border-radius:10px;padding:10px;margin-top:10px}
.lang{float:inline-end;margin-top:-34px;background:#fff3;color:#fff;border:1px solid #fff8;border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}header{overflow:hidden}
nav{display:flex;gap:8px;padding:10px 16px 0;max-width:560px;margin:auto}nav button{flex:1;padding:8px;border:0;border-radius:10px;font:inherit;background:#e4dfd0;cursor:pointer}nav button.on{background:var(--g);color:#fff}.farm h4{margin:14px 0 4px;color:var(--g)}.farm li{margin:4px 0}.farm a{color:var(--g)}.note{font-size:13px;color:#8a6d00}
.draft{font-size:12px;color:#8a6d00;margin-top:16px}
</style></head><body>
<header id="hd"></header>
<nav id="tabs"></nav><main id="app"></main>
<script src="crops.js"></script><script src="farmer.js"></script><script src="i18n.js"></script>
<script>
let L="he";try{L=localStorage.getItem("lang")||((navigator.language||"").startsWith("he")?"he":"en")}catch(e){}
const app=document.getElementById("app"),m=new Date().getMonth()+1;
const T=()=>I18N[L],crop=c=>L==="he"?c:Object.assign({},c,T().crops[c.id]);
let TAB="home";function tabs(){const t=T();document.getElementById("tabs").innerHTML=`<button class="${TAB=="home"?"on":""}" id="t1">${t.tabHome}</button><button class="${TAB=="farm"?"on":""}" id="t2">${t.tabFarm}</button><button class="${TAB=="diag"?"on":""}" id="t3">${t.tabDiag}</button>`;t3.onclick=()=>{TAB="diag";tabs();diag()};t1.onclick=()=>{TAB="home";tabs();home()};t2.onclick=()=>{TAB="farm";tabs();farm()}}
function farm(){const t=T();app.innerHTML=`<p>${t.farmIntro}</p>`+FARM.map(f=>`<div class="detail farm" style="margin-bottom:12px"><h3>${f.emoji} ${f.title}</h3><p class="note">${f.note}</p>`+f.sections.map(s=>`<h4>${s.h}</h4><ul>${s.l.map(x=>`<li>${x}</li>`).join("")}</ul>`).join("")+`<p>${t.source}: <a href="${f.src.url}" target="_blank" rel="noopener">${f.src.name}</a></p></div>`).join("")}
function diag(){const t=T();app.innerHTML=`<h2>📷 ${t.tabDiag}</h2><p>${t.diagIntro}</p><div class="detail"><label>${t.diagWho}<br><select id="who"><option value="h">${t.home}</option><option value="f">${t.farmer}</option></select></label><div class="row"><label>${t.diagCrop}<br><input id="cr" style="width:100%;padding:8px;font:inherit"></label></div><div class="row"><label class="card" style="display:block">📸 ${t.diagPick}<input id="ph" type="file" accept="image/*" capture="environment" hidden></label></div><img id="pv" style="max-width:100%;border-radius:10px;display:none"><div class="row"><button class="card" id="go" style="width:100%" disabled>${t.diagGo}</button></div><p class="note">${t.diagNote}</p></div>`;
 let f=null;ph.onchange=()=>{f=ph.files[0];if(f){pv.src=URL.createObjectURL(f);pv.style.display="block";go.disabled=false}};
 go.onclick=async()=>{const q=(L==="he"?"אני ":"I am ")+(who.value==="f"?(L==="he"?"חקלאי":"a farmer"):(L==="he"?"מגדל בגינה ביתית":"a home gardener"))+(L==="he"?" בישראל. בתמונה "+(cr.value||"צמח")+". מה אתה רואה: מחלה, מזיק, מחסור או בעיית השקיה? מה לעשות? תן כמה אפשרויות לפי סבירות, מה לבדוק כדי לוודא, ואם יש טיפול כימי הפנה לייעוץ שה\"ם ולתווית התכשיר.":" in Israel. The photo shows "+(cr.value||"a plant")+". Do you see a disease, pest, deficiency or watering problem? What should I do? Give options by likelihood, what to check to confirm, and for chemical treatment refer me to an extension officer and the product label.");
  try{await navigator.clipboard.writeText(q)}catch(e){}
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:q,title:t.tabDiag});return}catch(e){if(e.name==="AbortError")return}}
  alert(t.diagFallback)}}
function setLang(x){L=x;try{localStorage.setItem("lang",x)}catch(e){}head();tabs();TAB=="farm"?farm():TAB=="diag"?diag():home()}
function head(){const t=T();document.documentElement.lang=L;document.documentElement.dir=t.dir;document.title=t.title;
 document.getElementById("hd").innerHTML=`<h1>🌿 ${t.title}</h1><p>${t.sub}</p><button class="lang" id="lg">${t.other}</button>`;
 document.getElementById("lg").onclick=()=>setLang(L==="he"?"en":"he")}
function home(){const t=T(),now=CROPS.filter(c=>c.months.includes(m));
 app.innerHTML=`<h2>${t.now} (${t.months[m-1]})</h2>`+(now.length?grid(now):`<p>${t.none}</p>`)+`<h2>${t.all}</h2>`+grid(CROPS)+`<p class="draft">${t.draft}</p>`;
 app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>show(b.dataset.id))}
function grid(l){return `<div class="grid">`+l.map(c=>`<button class="card" data-id="${c.id}"><div class="e">${c.emoji}</div><b>${crop(c).name}</b></button>`).join("")+`</div>`}
function show(id){const t=T(),c=crop(CROPS.find(x=>x.id==id));
 app.innerHTML=`<button class="back" id="b">${t.back}</button><div class="detail"><h3>${c.emoji} ${c.name}</h3>
 <div class="row"><small>${t.when}</small>${c.months.map(x=>t.months[x-1]).join(", ")}</div>
 <div class="row"><small>${t.water}</small>${c.water}</div>
 <div class="row"><small>${t.why}</small>${c.why}</div>
 <div class="row"><small>${t.sun}</small>${c.sun}</div>
 <div class="row"><small>${t.harvest}</small>${c.harvest}</div>
 <div class="ilan">👨‍🌾 <b>${t.tip}:</b> ${c.tips}</div></div>`;
 document.getElementById("b").onclick=home;scrollTo(0,0)}
head();tabs();home();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
