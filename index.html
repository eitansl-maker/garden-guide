<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>הגינה של אילן</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#3f6b2d">
<style>
:root{--g:#3f6b2d;--bg:#f6f2e8;--c:#fff;--t:#2b2b25}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--g);color:#fff;padding:16px}h1{margin:0;font-size:22px}header p{margin:4px 0 0;opacity:.9;font-size:14px}
main{padding:16px;max-width:560px;margin:auto}h2{font-size:18px;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--c);border:0;border-radius:14px;padding:14px;text-align:center;font:inherit;box-shadow:0 1px 3px #0002;cursor:pointer}
.card .e{font-size:34px}.card b{display:block;margin-top:4px}
.detail{background:var(--c);border-radius:14px;padding:16px;box-shadow:0 1px 3px #0002}
.detail h3{margin:0 0 8px}.row{margin:10px 0}.row small{color:var(--g);font-weight:700;display:block}
.back{background:none;border:0;color:var(--g);font:inherit;margin-bottom:8px;cursor:pointer}
.ilan{background:#eef4e6;border-radius:10px;padding:10px;margin-top:10px}
.lang{display:block;margin:0 0 8px auto;margin-inline:auto 0;background:#fff3;color:#fff;border:1px solid #fff8;border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}
nav{display:flex;gap:8px;padding:10px 16px 0;max-width:560px;margin:auto}nav button{flex:1;padding:8px;border:0;border-radius:10px;font:inherit;background:#e4dfd0;cursor:pointer}nav button.on{background:var(--g);color:#fff}.farm h4{margin:14px 0 4px;color:var(--g)}.farm li{margin:4px 0}.farm a{color:var(--g)}.note{font-size:13px;color:#8a6d00}
@keyframes sp{to{transform:rotate(360deg)}}.spin{display:inline-block;width:18px;height:18px;border:3px solid #9bb88a;border-top-color:var(--g);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-inline-end:8px}
.draft{font-size:12px;color:#8a6d00;margin-top:16px}
</style></head><body>
<header id="hd"></header>
<nav id="tabs"></nav><main id="app"></main>
<script src="crops.js"></script><script src="farmer.js"></script><script src="i18n.js"></script>
<script>
let L="he";try{L=localStorage.getItem("lang")||((navigator.language||"").startsWith("he")?"he":"en")}catch(e){}
const app=document.getElementById("app"),m=new Date().getMonth()+1;
const T=()=>I18N[L],crop=c=>L==="he"?c:Object.assign({},c,T().crops[c.id]);
let TAB="home";function tabs(){const t=T();document.getElementById("tabs").innerHTML=`<button class="${TAB=="home"?"on":""}" id="t1">${t.tabHome}</button><button class="${TAB=="farm"?"on":""}" id="t2">${t.tabFarm}</button><button class="${TAB=="diag"?"on":""}" id="t3">${t.tabDiag}</button>`;t3.onclick=()=>{TAB="diag";tabs();diag()};t1.onclick=()=>{TAB="home";tabs();home()};t2.onclick=()=>{TAB="farm";tabs();farm()}}
let FT="log";
const TYPES=["ריסוס","הדברה","דישון","השקיה","גיזום / עבודת קרקע","זריעה / שתילה","קטיף","אחר"];
const lg=()=>{try{return JSON.parse(localStorage.getItem("flog")||"[]")}catch(e){return[]}};
const sv=a=>{try{localStorage.setItem("flog",JSON.stringify(a))}catch(e){alert("לא ניתן לשמור")}};
const esc=x=>String(x||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function farm(){app.innerHTML=`<div style="display:flex;gap:6px;margin-bottom:10px">`+[["log","📒 יומן"],["ask","💬 שאל יועץ"],["guides","📚 מדריכים"]].map(x=>`<button class="card" data-f="${x[0]}" style="flex:1;padding:8px;${FT==x[0]?"background:var(--g);color:#fff":""}">${x[1]}</button>`).join("")+`</div><div id="fb" dir="rtl"></div>`;
 app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{FT=b.dataset.f;farm()});({log:flog,ask:fask,guides:fguides})[FT]()}
function fguides(){const t=T();fb.innerHTML=`<p>${t.farmIntro}</p>`+FARM.map(f=>`<div class="detail farm" style="margin-bottom:12px"><h3>${f.emoji} ${f.title}</h3><p class="note">${f.note}</p>`+f.sections.map(s=>`<h4>${s.h}</h4><ul>${s.l.map(x=>`<li>${x}</li>`).join("")}</ul>`).join("")+`<p>${t.source}: <a href="${f.src.url}" target="_blank" rel="noopener">${f.src.name}</a></p></div>`).join("")}
function flog(){const ALL=lg(),L_=ALL.filter(x=>x.kind!=="ins"),INS=ALL.filter(x=>x.kind==="ins"),plots=[...new Set(L_.map(x=>x.plot))];const inp="width:100%;padding:8px;font:inherit;margin-top:2px";
 const today=new Date().toISOString().slice(0,10);
 const last=plots.map(p=>{const e=L_.filter(x=>x.plot===p).sort((a,b)=>b.date.localeCompare(a.date));const l=e[0];const ty={};e.forEach(x=>{if(!ty[x.type])ty[x.type]=x});return `<div class="detail" style="margin-bottom:8px"><b>${esc(p)}</b> · ${esc(l.crop)}<br><small>טיפול אחרון: ${esc(l.type)} ב-${l.date}${l.product?" ("+esc(l.product)+")":""}</small><br><small>${Object.values(ty).map(x=>esc(x.type)+" "+x.date).join(" · ")}</small></div>`}).join("");
 fb.innerHTML=`<div class="detail"><h3>➕ רישום חדש</h3>
 <label>סוג רישום<select id="lk" style="${inp}"><option value="done">בוצע (עשיתי)</option><option value="ins">הוראת מדריך (לביצוע)</option></select></label>
 <label id="lbw" style="display:none">שם המדריך<input id="lb" style="${inp}"></label>
 <label>חלקה<input id="lp" list="pl" style="${inp}" placeholder="למשל: חלקה צפונית"></label><datalist id="pl">${plots.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
 <label>גידול<input id="lc" style="${inp}" placeholder="למשל: תות"></label>
 <label id="ldl">תאריך<input id="ld" type="date" value="${today}" style="${inp}"></label>
 <label>סוג טיפול<select id="lt" style="${inp}">${TYPES.map(x=>`<option>${x}</option>`).join("")}</select></label>
 <label>חומר / דשן<input id="lm" style="${inp}"></label>
 <label>מינון / כמות<input id="ls" style="${inp}"></label>
 <label>הערות<textarea id="ln" rows="2" style="${inp}"></textarea></label>
 <button class="card" id="la" style="width:100%;margin-top:8px;background:var(--g);color:#fff">שמור ביומן</button></div>
 ${INS.length?`<h3>📋 הוראות מדריך פתוחות</h3>`+[...INS].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="detail" style="margin-bottom:8px;border-right:4px solid #c98a00"><b>${x.date}</b> · ${esc(x.plot)} · ${esc(x.crop)}<br>${esc(x.type)}${x.product?": "+esc(x.product):""}${x.dose?" · "+esc(x.dose):""}${x.by?"<br><small>מדריך: "+esc(x.by)+"</small>":""}${x.notes?"<br><small>"+esc(x.notes)+"</small>":""}${x.date<today?"<br><small style=\"color:#b00\">עבר התאריך</small>":""}<br><button class="card" data-ok="${x.id}" style="margin-top:6px">✔ סמן כבוצע</button> <button class="back" data-d="${x.id}">מחק</button></div>`).join(""):""}
 <h3>מצב לפי חלקה</h3>${last||"<p>עדיין אין רישומים.</p>"}
 <h3>היסטוריה</h3>`+[...L_].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).map(x=>`<div class="detail" style="margin-bottom:8px"><b>${x.date}</b> · ${esc(x.plot)} · ${esc(x.crop)}<br>${esc(x.type)}${x.product?": "+esc(x.product):""}${x.dose?" · "+esc(x.dose):""}${x.by?"<br><small>מדריך: "+esc(x.by)+"</small>":""}${x.notes?"<br><small>"+esc(x.notes)+"</small>":""}<br><button class="back" data-d="${x.id}">מחק</button></div>`).join("")+(L_.length?`<button class="card" id="lx" style="width:100%">⬇️ ייצוא לקובץ (CSV)</button>`:"")+`<p class="note">היומן נשמר רק בטלפון הזה. אם תנקה נתוני אתר הוא יימחק, ולכן כדאי לייצא מדי פעם.</p>`;
 lk.onchange=()=>{lbw.style.display=lk.value==="ins"?"block":"none";ldl.firstChild.textContent=lk.value==="ins"?"תאריך לביצוע":"תאריך";la.textContent=lk.value==="ins"?"שמור הוראה":"שמור ביומן"};
 fb.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{const a=lg(),x=a.find(y=>y.id==b.dataset.ok);if(x){x.kind="done";x.date=today;x.notes=(x.notes?x.notes+" · ":"")+"בוצע לפי הוראת מדריך";sv(a);flog()}});
 la.onclick=()=>{if(!lp.value.trim()||!lc.value.trim()){alert("חלקה וגידול חובה");return}const a=lg();a.push({kind:lk.value,by:lb.value.trim(),id:Date.now(),plot:lp.value.trim(),crop:lc.value.trim(),date:ld.value,type:lt.value,product:lm.value.trim(),dose:ls.value.trim(),notes:ln.value.trim()});sv(a);flog()};
 fb.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(confirm("למחוק?")){sv(lg().filter(x=>x.id!=b.dataset.d));flog()}});
 if(window.lx)lx.onclick=()=>{const q=v=>'"'+String(v||"").replace(/"/g,'""')+'"';const csv="\ufeff"+["תאריך,חלקה,גידול,טיפול,חומר,מינון,הערות",...lg().map(x=>[x.date,x.plot,x.crop,(x.kind==="ins"?"הוראה: ":"")+x.type,x.product,x.dose,(x.by?"מדריך "+x.by+". ":"")+x.notes].map(q).join(","))].join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="yoman-gidul.csv";a.click()}}
function fask(){fb.innerHTML=`<div class="detail"><h3>💬 שאל יועץ</h3><p class="note">שאל שאלה בחקלאות. התשובה היא הערכה של AI ולא תחליף ליועץ שה"ם; בטיפול כימי תמיד לפי התווית.</p><textarea id="aq" rows="4" style="width:100%;padding:8px;font:inherit" placeholder="למשל: העלים של התות מצהיבים בקצוות, מה בודקים?"></textarea><button class="card" id="ab" style="width:100%;margin-top:8px;background:var(--g);color:#fff">שאל</button><div id="ao" class="ilan" style="display:none;white-space:pre-wrap"></div><p class="note">נדרש מפתח Gemini (אותו מפתח של האבחון בתמונה).</p></div>`;
 ab.onclick=async()=>{let k="";try{k=localStorage.getItem("gkey")||""}catch(e){}if(!k){alert("הדבק קודם מפתח Gemini בלשונית 'אבחון בתמונה'.");return}if(!aq.value.trim())return;
  ao.style.display="block";ao.innerHTML='<span class="spin"></span>חושב...';ab.disabled=true;
  const q="אתה יועץ חקלאי בישראל שמסייע לחקלאים. ענה בעברית קצרה וברורה, מעשית. אם לא בטוח, אמור זאת ומה לבדוק. אל תמליץ על מינוני חומרי הדברה, הפנה לתווית התכשיר וליועץ שה\"ם. שאלה: "+aq.value.trim();
  try{const ms=await(await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=100&key="+k,{signal:AbortSignal.timeout(15000)})).json();if(ms.error)throw new Error(ms.error.message);
   const all=(ms.models||[]).filter(x=>(x.supportedGenerationMethods||[]).includes("generateContent")&&/flash/.test(x.name)&&!/image|tts|live|exp|thinking|audio|robotics|computer|preview|lite/.test(x.name)).map(x=>x.name).sort().reverse();
   const names=[...all.filter(n=>/2\.5-flash$/.test(n)),...all.filter(n=>!/2\.5-flash$/.test(n))].slice(0,3);let res,last="";
   for(const n of names){ao.innerHTML='<span class="spin"></span>חושב... ('+n.replace("models/","")+")";const r=await fetch("https://generativelanguage.googleapis.com/v1beta/"+n+":generateContent?key="+k,{method:"POST",headers:{"Content-Type":"application/json"},signal:AbortSignal.timeout(15000),body:JSON.stringify(Object.assign({contents:[{parts:[{text:q}]}]},/2\.5-flash$/.test(n)?{generationConfig:{thinkingConfig:{thinkingBudget:0}}}:{}))}).catch(()=>({json:async()=>({error:{message:"timeout"}})}));res=await r.json();if(!res.error)break;last=res.error.message}
   if(res.error)throw new Error(last);ao.textContent=(res.candidates?.[0]?.content?.parts||[]).map(x=>x.text||"").join("")||"?"}catch(e){ao.textContent="שגיאה: "+e.message}ab.disabled=false}}
function prompt_(w,c){return (L==="he"?"אני ":"I am ")+(w==="f"?(L==="he"?"חקלאי":"a farmer"):(L==="he"?"מגדל בגינה ביתית":"a home gardener"))+(L==="he"?" בישראל. בתמונה "+(c||"צמח או פרי")+". מה אתה רואה: מחלה, מזיק, מחסור או בעיית השקיה? מה לעשות? ענה בעברית קצרה וברורה: מה זה נראה, כמה אפשרויות לפי סבירות, מה לבדוק כדי לוודא, ומה לעשות. אם נדרש טיפול כימי, אל תמליץ על מינון, הפנה ליועץ שה\"ם ולתווית התכשיר.":" in Israel. The photo shows "+(c||"a plant or fruit")+". Do you see a disease, pest, deficiency or watering problem? What should I do? Answer briefly and clearly: what it looks like, options by likelihood, what to check, what to do. For chemical treatment give no dosage; refer to an extension officer and the product label.")}
function shrink(f){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1024/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.8).split(",")[1])};i.onerror=no;i.src=URL.createObjectURL(f)})}
function diag(){const t=T();app.innerHTML=`<h2>📷 ${t.tabDiag}</h2><p>${t.diagIntro}</p><div class="detail"><label>${t.diagWho}<br><select id="who"><option value="h">${t.home}</option><option value="f">${t.farmer}</option></select></label><div class="row"><label>${t.diagCrop}<br><input id="cr" style="width:100%;padding:8px;font:inherit"></label></div><div class="row"><label class="card" style="display:block">📸 ${t.diagPick}<input id="ph" type="file" accept="image/*" capture="environment" hidden></label></div><img id="pv" style="max-width:100%;border-radius:10px;display:none"><div class="row"><button class="card" id="ai" style="width:100%;background:var(--g);color:#fff" disabled>${t.diagAI}</button></div><div id="out" class="ilan" style="display:none;white-space:pre-wrap"></div><details class="row"><summary>${t.diagKey}</summary><p class="note">${t.diagKeyHelp}</p><input id="key" type="password" style="width:100%;padding:8px;font:inherit" placeholder="AIza..."><button class="card" id="sk" style="margin-top:6px">${t.save}</button></details><p class="note">${t.diagNote}</p></div>`;
 let f=null;ph.onchange=()=>{f=ph.files[0];if(f){pv.src=URL.createObjectURL(f);pv.style.display="block";ai.disabled=false}};
 try{key.value=localStorage.getItem("gkey")||""}catch(e){}
 sk.onclick=()=>{try{localStorage.setItem("gkey",key.value.trim())}catch(e){}alert("OK")};
 ai.onclick=async()=>{const k=key.value.trim();if(!k){alert(t.diagNoKey);document.querySelector("details").open=true;return}
  out.style.display="block";out.innerHTML=`<span class="spin"></span>${t.diagWait}`;ai.disabled=true;
  try{const img=await shrink(f);const q=prompt_(who.value,cr.value);
   const ms=(await(await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=100&key="+k,{signal:AbortSignal.timeout(15000)})).json());if(ms.error)throw new Error(ms.error.message);
   const ok=x=>(x.supportedGenerationMethods||[]).includes("generateContent")&&/flash/.test(x.name)&&!/image|tts|live|exp|thinking|audio|robotics|computer/.test(x.name);
   const all=(ms.models||[]).filter(ok).map(x=>x.name);
   const names=[...all.filter(n=>!/lite|preview/.test(n)).sort().reverse(),...all.filter(n=>/preview/.test(n)&&!/lite/.test(n)).sort().reverse(),...all.filter(n=>/lite/.test(n)).sort().reverse()];
   if(!names.length)throw new Error("no model");
   let res,last="";
   outer:for(const n of [...names.filter(n=>/2\.5-flash$/.test(n)),...names.filter(n=>!/2\.5-flash$/.test(n))].slice(0,3)){for(let a=0;a<1;a++){out.innerHTML=`<span class="spin"></span>${t.diagWait} (${n.replace("models/","")})`;const r=await fetch("https://generativelanguage.googleapis.com/v1beta/"+n+":generateContent?key="+k,{method:"POST",headers:{"Content-Type":"application/json"},signal:AbortSignal.timeout(15000),body:JSON.stringify(Object.assign({contents:[{parts:[{text:q},{inline_data:{mime_type:"image/jpeg",data:img}}]}]},/2\.5-flash$/.test(n)?{generationConfig:{thinkingConfig:{thinkingBudget:0}}}:{}))}).catch(e=>({status:599,json:async()=>({error:{message:"timeout"}})}));res=await r.json();if(!res.error)break outer;last=res.error.message;if(!/demand|overload|unavailable|try again|quota|rate|timeout/i.test(last)&&r.status<500&&r.status!==429)break outer;if(r.status===599)break;await new Promise(z=>setTimeout(z,1500))}}
   if(res.error)throw new Error(last);
   out.textContent=(res.candidates?.[0]?.content?.parts||[]).map(x=>x.text||"").join("")||"?"}catch(e){out.textContent=t.diagErr+" "+e.message}
  ai.disabled=false};

}
function setLang(x){L=x;try{localStorage.setItem("lang",x)}catch(e){}head();tabs();TAB=="farm"?farm():TAB=="diag"?diag():home()}
let DP=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();DP=e;const b=document.getElementById("inst");if(b)b.style.display="block"});
function head(){const t=T();document.documentElement.lang=L;document.documentElement.dir=t.dir;document.title=t.title;
 document.getElementById("hd").innerHTML=`<button class="lang" id="lg">${t.other}</button><h1>🌿 ${t.title}</h1><p>${t.sub}</p><button class="lang" id="inst" style="display:${DP?"block":"none"};margin:8px 0 0">📲 ${t.install}</button>`;inst.onclick=async()=>{if(DP){DP.prompt();DP=null;inst.style.display="none"}};
 document.getElementById("lg").onclick=()=>setLang(L==="he"?"en":"he")}
function home(){const t=T(),now=CROPS.filter(c=>c.months.includes(m));
 app.innerHTML=`<h2>${t.now} (${t.months[m-1]})</h2>`+(now.length?grid(now):`<p>${t.none}</p>`)+`<h2>${t.all}</h2>`+grid(CROPS)+`<p class="draft">${t.draft}</p>`;
 app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>show(b.dataset.id))}
function grid(l){return `<div class="grid">`+l.map(c=>`<button class="card" data-id="${c.id}"><div class="e">${c.emoji}</div><b>${crop(c).name}</b></button>`).join("")+`</div>`}
function show(id){const t=T(),c=crop(CROPS.find(x=>x.id==id));
 app.innerHTML=`<button class="back" id="b">${t.back}</button><div class="detail"><h3>${c.emoji} ${c.name}</h3>
 <div class="row"><small>${t.when}</small>${c.months.map(x=>t.months[x-1]).join(", ")}</div>
 <div class="row"><small>${t.water}</small>${c.water}</div>
 <div class="row"><small>${t.why}</small>${c.why}</div>
 <div class="row"><small>${t.sun}</small>${c.sun}</div>
 <div class="row"><small>${t.harvest}</small>${c.harvest}</div>
 <div class="ilan">👨‍🌾 <b>${t.tip}:</b> ${c.tips}</div></div>`;
 document.getElementById("b").onclick=home;scrollTo(0,0)}
head();tabs();home();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
